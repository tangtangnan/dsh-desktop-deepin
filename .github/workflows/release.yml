name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Scan for content that must not be published
        run: npm run scan:leaks

      # Fails on a version or integrity mismatch against upstream.lock.json, so a release
      # cannot be built from a kernel other than the pinned one.
      - name: Install the pinned kernel
        run: npm run kernel:install

      - name: End-to-end
        run: npm run test:e2e

      - name: Build installers
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  # ── Linux deb 打包（方案 A：deb 只含壳代码，运行时首次启动按架构自举下载）──
  # Electron/Node/dsh 都不进包，所以同一个源码分别打 amd64 与 arm64 两个架构的 deb。
  build-linux-deb:
    name: Build deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build the ${{ matrix.arch }} deb
        run: bash tools/build-deb.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: release/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, build-linux-deb]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
