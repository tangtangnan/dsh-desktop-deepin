name: Package Linux

# 打包 deb（方案 A：只装壳代码，约 100KB）。
# Electron / Node / dsh 运行时由最终用户首次启动时按需下载（国内镜像优先），
# 见 tools/bootstrap.sh。因此这里用 dpkg-deb 手工打包，不走 electron-builder。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 需要 contents: write 才能创建 release 并上传 deb（默认 GITHUB_TOKEN 是只读的，
# 会导致 "Resource not accessible by integration" 403）。
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shell dependencies
        run: npm ci

      - name: Test
        run: npm test

      # 不下载内核 / Node / Electron：三者都在首次启动时按需获取（见 README）。

      - name: Package deb (壳代码，约 100KB)
        # 方案 A：deb 只装壳代码，Electron/Node/dsh 首次启动按需下载。
        # 用 dpkg-deb 手工打包，不再用 electron-builder（它会把 Electron 打进包）。
        run: bash tools/build-deb.sh

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.deb

      - name: Attach to release
        # 仅在打 tag 时挂到 release 上；手动触发只留 artifact。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
