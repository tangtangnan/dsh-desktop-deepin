name: Package Linux

# GitHub 不会自动打包 deb —— 这里才是真正干活的地方。
# Actions 只是执行器，打包由 electron-builder 在 ubuntu-latest 上完成。
#
# 参照 citrusli2026/dsh-desktop 的 release.yml：
#   runs-on: ubuntu-latest
#   # Linux: deb 覆盖 Debian/Ubuntu/UOS/Deepin/麒麟桌面,为唯一格式。
#   pnpm exec electron-builder --linux deb --publish never

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shell dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install kernel and bundled Node
        # 内核与 Node 运行时按 upstream.lock.json 钉的版本下载并校验哈希，
        # 失败即终止构建。
        run: npm run kernel:install

      - name: Package (deb + AppImage)
        # electron-builder 直接调用；--publish never 阻止它替我们创建 release，
        # 产物用下面的 upload-artifact 收集，发布另行处理。
        run: npx electron-builder --linux deb --linux AppImage --publish never

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.deb
            release/*.AppImage

      - name: Attach to release
        # 仅在打 tag 时挂到 release 上；手动触发只留 artifact。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
