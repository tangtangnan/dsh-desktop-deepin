name: CI

# 把 GitHub 侧 .github/workflows/ci.yml 的门禁搬到 AtomGit：push main / PR / 手动。
#
# 与打包流水线分开，是因为二者关注点不同：这里的问题（类型错、测试挂、内容泄露）
# 应该在代码合入前就拦住，而 package-linux.yml 只关心能不能出包。此前这两件事
# 都挤在打包流程里，导致 CI 在 AtomGit 上缺位——.github 下的 workflow 平台不识别。
#
# AtomGit 语法：runs-on 用三段式数组；name 只允许字母数字空格与 - _ , ; : . / ( )。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    name: Test and scan
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # scan-leaks inspects the committed history, not just the working tree.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Scan for content that must not be published
        run: npm run scan:leaks

  e2e:
    name: End-to-end
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install --ignore-scripts --no-audit --no-fund

      # Verifies the pinned version and integrity as part of installing, so a registry
      # serving something other than what upstream.lock.json names fails here. This
      # project ships Linux debs only, so the kernel e2e runs on the platform the
      # artifacts are actually built for.
      - name: Install the pinned kernel
        run: npm run kernel:install

      - name: Start the kernel for real and assert it serves
        run: npm run test:e2e